[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-xli"
version = "0.2.0"
description = "Build polished, transcript-style terminal interfaces for chat / agent / REPL-ish apps in 20 lines of Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fariz Rahman", email = "farizrahman4u@gmail.com" }]
keywords = ["terminal", "tui", "cli", "chat", "agent", "transcript", "rich", "prompt-toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]
dependencies = [
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
]

[project.optional-dependencies]
markdown = ["pygments>=2.17"]
images = ["pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/vitalops/xli"
Issues = "https://github.com/vitalops/xli/issues"

[tool.hatch.build.targets.wheel]
packages = ["xli"]

[tool.hatch.build.targets.sdist]
include = [
    "xli",
    "tests",
    "examples",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
